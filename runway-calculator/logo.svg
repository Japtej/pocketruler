<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .charcoal {
        stroke: #18181b;
        stroke-width: 7.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .blue {
        stroke: #2563eb;
        stroke-width: 6.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
    </style>
  </defs>

  <!-- Charcoal Modular Interlocking Brackets -->
  <!-- Top-Left Hook -->
  <path class="charcoal" d="M 45 15 H 37 Q 33 15 33 19 V 35" />

  <!-- Top-Right & Right Interlocking Bracket -->
  <path class="charcoal" d="M 55 15 H 63 Q 67 15 67 19 V 35 Q 67 39 71 39 H 81 Q 87 39 87 45 V 55 Q 87 61 81 61 H 58" />

  <!-- Bottom-Left & Left Interlocking Bracket -->
  <path class="charcoal" d="M 42 39 H 19 Q 13 39 13 45 V 55 Q 13 61 19 61 H 29 Q 33 61 33 65 V 81 Q 33 85 37 85 H 45" />

  <!-- Bottom-Right Hook -->
  <path class="charcoal" d="M 55 85 H 63 Q 67 85 67 81 V 65" />

  <!-- Blue Precision Central Plus -->
  <path class="blue" d="M 50 35 V 65" />
  <path class="blue" d="M 35 50 H 65" />

  <!-- Blue Segmented Pill Tips -->
  <path class="blue" d="M 50 20 V 26" />
  <path class="blue" d="M 50 74 V 80" />
  <path class="blue" d="M 20 50 H 26" />
  <path class="blue" d="M 74 50 H 80" />
</svg>
